<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAPSUL CARDIOVICTUS 3.2</title><style>
:root{--bg:#0F1929;--s1:#16243a;--s2:#1d2f4b;--ac:#F5C842;--tx:#e8edf5;--mut:#8b9ab3;--ok:#3ecf8e;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.5px;color:var(--ac);cursor:pointer}.tag{background:var(--s2);border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px;color:var(--tx)}
.pill{background:var(--ac);color:#1a1a1a;font-weight:700;border-radius:20px;padding:3px 12px;font-size:13px}
.bar{height:5px;background:var(--s2);border-radius:4px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a5a75,var(--ac));transition:width .3s}
.modes{display:grid;gap:10px}.mode{background:var(--s1);border:1px solid var(--s2);color:var(--tx);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit}.mode b{display:block;color:var(--ac);font-size:16px}.mode span{color:var(--mut);font-size:13px}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:16px;margin:10px 0}.qn{color:var(--mut);font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.opt{display:flex;gap:10px;width:100%;background:var(--s2);color:var(--tx);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;margin:7px 0;text-align:left;cursor:pointer;font:inherit}
.opt b{min-width:20px;color:var(--mut)}.opt.sel{border-color:var(--ac)}.opt.ok{border-color:var(--ac);background:#3a3417}.opt.ok b{color:var(--ac)}.opt.bad{border-color:var(--bad);background:#3a1d24}
.exp{border-left:3px solid var(--ac);background:#1b2b45;border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px;font-size:14px}.exp b{color:var(--ac)}
.nav{display:flex;gap:8px;justify-content:space-between;margin:10px 0;flex-wrap:wrap}button.b{background:var(--s2);color:var(--tx);border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font:inherit}button.b.p{background:var(--ac);color:#1a1a1a;font-weight:700}button.b.f.on{outline:2px solid var(--ac)}
.map{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.map i{width:22px;height:22px;border-radius:5px;background:var(--s2);font:11px/22px system-ui;text-align:center;cursor:pointer;font-style:normal;color:var(--mut)}.map i.d{background:#3b4d6b;color:var(--tx)}.map i.fl{outline:2px solid var(--ac)}.map i.c{background:var(--ac);color:#111}
.mut{color:var(--mut);font-size:13px}.big{font-size:42px;color:var(--ac);font-weight:800;margin:0}#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#111;font-weight:800;padding:9px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none}#t.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:12px;padding:22px 0 10px}
</style></head><body><div class="w"><header><h1 onclick="home()">KAPSUL CARDIOVICTUS 3.2<span class="tag">CBT 1</span></h1><span class="pill" id="sc">0 / 0</span></header><div id="app"></div><footer>Credit by mr capsules</footer></div><div id="t"></div><script>
const Q=[
{q:"Pada perkembangan embrio manusia, respiratory diverticulum (lung bud) pertama kali muncul dari dinding ventral foregut pada minggu ke-berapa?",o:["Minggu ke-2","Minggu ke-3","Minggu ke-4","Minggu ke-5","Minggu ke-6"],a:2,e:"Lung bud muncul sebagai tonjolan dari dinding ventral foregut saat embrio berusia <b>±4 minggu</b>, dipandu sinyal FGF dari mesenkim sekitar. Setelah itu tracheoesophageal septum memisahkan esofagus (dorsal) dari trakea dan lung bud (ventral). Minggu 2–3 masih tahap gastrulasi/neurulasi."},
{q:"Pernyataan yang benar mengenai kompleks troponin adalah ...",o:["Troponin hanya terdiri dari troponin I dan T.","Troponin I merupakan subunit yang mengikat kalsium.","Troponin T berikatan dengan tropomiosin.","Troponin I selalu terdeteksi 2–4 jam setelah serangan infark miokard.","Troponin I selalu lebih sensitif daripada troponin T."],a:2,e:"Kompleks troponin punya 3 subunit: <b>C</b> mengikat Ca²⁺, <b>T</b> mengikat tropomiosin, <b>I</b> mengikat aktin dan menghambat interaksi aktin–miosin. A salah (ada 3 subunit), B salah (yang mengikat Ca²⁺ adalah C). D dan E memakai kata \"selalu\", sehingga salah."},
{q:"NT-proBNP digunakan sebagai biomarker gagal jantung. Pernyataan yang sesuai adalah ...",o:["NT-proBNP merupakan hormon aktif.","NT-proBNP merupakan molekul aktif dengan efek vasodilatasi langsung.","NT-proBNP memiliki waktu paruh sekitar 60–120 menit.","NT-proBNP dibersihkan hanya melalui degradasi oleh neutral endopeptidase dan receptor clearance.","NT-proBNP hanya meningkat pada perubahan akut fungsi jantung."],a:2,e:"NT-proBNP adalah fragmen <b>tidak aktif</b> dari pro-hormon, waktu paruh <b>60–120 menit</b> (BNP aktif hanya ±20 menit), dibersihkan lewat ginjal, sehingga lebih stabil dan kadarnya naik pada gangguan ginjal. Jalur neutral endopeptidase dan receptor clearance milik BNP. NT-proBNP juga meningkat pada gagal jantung kronis."},
{q:"Pada pasien dengan infeksi Candida di paru, jalur penyebaran yang dimaksud adalah ...",o:["Droplet dari pasien yang terinfeksi.","Penyebaran hematogen dari sumber infeksi lain.","Kontak dengan permukaan yang terkontaminasi.","Penularan langsung dari unggas yang terinfeksi.","Penularan melalui gigitan vektor."],a:1,e:"Pneumonia Candida (kandidiasis paru invasif) hampir selalu terjadi akibat <b>penyebaran hematogen</b> dari sumber sistemik lain, misalnya kandidemia atau infeksi saluran cerna, terutama pada pasien imunokompromais atau kritis (ventilator, kateter vena sentral, antibiotik spektrum luas)."},
{q:"Urutan stadium syok yang benar adalah ...",o:["Kompensasi → ireversibel → dekompensasi","Ireversibel → kompensasi → dekompensasi","Kompensasi → dekompensasi → ireversibel","Dekompensasi → kompensasi → ireversibel","Ireversibel → dekompensasi → kompensasi"],a:2,e:"Syok berjalan progresif: <b>kompensasi</b> (tubuh masih mempertahankan perfusi organ vital) → <b>dekompensasi</b> (mekanisme gagal: hipotensi, oliguri, asidosis) → <b>ireversibel</b> (kerusakan organ menetap, berujung kematian)."},
{q:"Laki-laki 51 tahun didiagnosis non-small cell lung cancer (NSCLC). Pemeriksaan tambahan yang penting untuk menentukan terapi target dan imunoterapi adalah ...",o:["Pemeriksaan kadar glukosa dan HbA1c.","Pemeriksaan elektrolit dan fungsi ginjal saja.","Pemeriksaan kultur sputum saja.","Pemeriksaan mutasi driver dan ekspresi PD-L1.","Pemeriksaan kadar hemoglobin saja."],a:3,e:"Pada NSCLC lanjut, <b>mutasi driver</b> (EGFR, ALK, ROS1, KRAS, BRAF, RET) menentukan terapi target, sedangkan <b>ekspresi PD-L1</b> menentukan strategi imunoterapi. Glukosa, elektrolit, kultur sputum, dan Hb tidak menentukan pilihan terapi tersebut."},
{q:"Pasien mengalami hipoperfusi jaringan akibat kehilangan cairan yang berat. Jenis syok yang paling mungkin adalah ...",o:["Syok kardiogenik","Syok anafilaktik","Syok septik","Syok hipovolemik","Syok neurogenik"],a:3,e:"Syok <b>hipovolemik</b> disebabkan perdarahan masif atau hilangnya cairan tubuh berlebihan, sehingga volume sirkulasi dan preload turun. Kardiogenik = gagal pompa; anafilaktik, septik, dan neurogenik termasuk syok distributif (vasodilatasi)."},
{q:"Komponen bakteri Gram-negatif yang berperan dalam septikemia adalah ...",o:["Eksotoksin","Endotoksin","Flagelin","Peptidoglikan sebagai komponen utama endotoksin","Ribosom"],a:1,e:"<b>Endotoksin</b> (lipid A pada LPS dinding sel Gram-negatif) merangsang pelepasan TNF-α, IL-1, IL-6, mengaktifkan komplemen dan koagulasi, lalu menimbulkan demam, DIC, dan syok septik. Peptidoglikan bukan komponen endotoksin."},
{q:"Pasien miokarditis akibat infeksi virus. Mekanisme yang dapat menyebabkan kerusakan sel miosit adalah ...",o:["Respons inflamasi dan kerusakan jaringan oleh sistem imun.","Akumulasi histamin sebagai satu-satunya penyebab.","Penumpukan LDL di dalam miosit.","Peningkatan sintesis protein kontraktil yang berlebihan.","Peningkatan produksi eritrosit di jaringan miokard."],a:0,e:"Infeksi virus memicu peradangan, lalu mengaktifkan respons imun (sitokin, radikal bebas oksigen, sel T, makrofag, sel B) yang <b>merusak miosit</b>. Pilihan lain tidak menjelaskan patogenesis miokarditis."},
{q:"Pada respiratory syncytial virus (RSV), fungsi protein G dan protein F secara berurutan adalah ...",o:["Replikasi RNA dan transkripsi RNA","Perlekatan pada sel inang dan fusi membran yang dapat membentuk syncytium","Fusi membran dan perlekatan pada sel inang","Menghambat interferon dan membungkus RNA","Perakitan virus dan sintesis protein"],a:1,e:"Protein <b>G</b> = perlekatan (attachment) virus ke sel inang. Protein <b>F</b> = fusi membran, mendorong pembentukan <b>syncytium</b> (sel-sel menyatu). Urutan pada opsi C terbalik."},
{q:"Biomarker yang meningkat paling awal setelah infark miokard adalah ...",o:["CK total","Troponin T","Troponin I","Mioglobin","CK-MB"],a:3,e:"<b>Mioglobin</b> naik paling awal (dalam 1–3 jam), sensitivitas tinggi tetapi spesifisitas rendah karena juga berasal dari otot rangka. Troponin dan CK-MB naik lebih lambat tetapi lebih spesifik."},
{q:"Kegagalan fusi endocardial cushion pada atrioventricular canal dapat menyebabkan kelainan berupa ...",o:["Koarktasio aorta","Persistent truncus arteriosus","Tetralogi Fallot","Persistent atrioventricular canal","Transposisi arteri besar"],a:3,e:"Endocardial cushion yang gagal menyatu menyebabkan <b>persistent AV canal</b> (defek septum atrioventrikular), sering ditemukan pada sindrom Down. Truncus arteriosus, Fallot, dan transposisi berkaitan dengan septasi/rotasi outflow tract."},
{q:"Peningkatan permeabilitas kapiler yang menyebabkan cairan keluar ke interstisial terutama terjadi pada kondisi ...",o:["Gagal jantung kanan atau kiri saja","Inflamasi sistemik","Hipoalbuminemia saja","Gangguan ginjal saja","Obstruksi limfatik saja"],a:1,e:"Edema akibat <b>permeabilitas dinding pembuluh meningkat</b> disebabkan proses radang sistemik. Gagal jantung → tekanan hidrostatik naik; hipoalbuminemia → tekanan onkotik turun; gagal ginjal → retensi natrium; obstruksi limfe → elephantiasis."},
{q:"Saat tubuh kekurangan cairan, hormon yang berperan mempertahankan air dan volume cairan tubuh adalah ...",o:["ADH","ANP","Aldosteron","ADH dan ANP","ADH dan aldosteron"],a:4,e:"<b>ADH</b> meningkatkan reabsorpsi air, <b>aldosteron</b> meningkatkan reabsorpsi natrium (air mengikuti), sehingga volume dipertahankan. <b>ANP</b> bekerja pada kelebihan cairan (meningkatkan ekskresi natrium dan air), jadi opsi B dan D salah."},
{q:"Pada awal perkembangan embrio, kombinasi sinyal yang penting mengarahkan pembentukan jaringan jantung adalah ...",o:["FGF-8 dan aktivasi WNT","BMP-2 dan BMP-4 disertai inhibisi WNT","SHH dan PAX6","VEGF dan TGF-β","Asam retinoat dan TBX1"],a:1,e:"Sinyal <b>BMP-2, BMP-4</b> dengan <b>inhibisi WNT</b> di mesoderm anterior menginduksi ekspresi NKX-2.5 (tinman) dan menentukan mesoderm menjadi jaringan jantung (heart field). Aktivasi WNT justru menghambat pembentukan jantung."},
{q:"Pasien sindrom nefrotik dengan proteinuria masif. Urutan mekanisme yang paling tepat hingga menyebabkan edema adalah ...",o:["Kerusakan glomerulus → retensi natrium dan air → peningkatan tekanan intravaskular → edema.","Proteinuria masif → hipoalbuminemia → penurunan tekanan osmotik koloid plasma → cairan berpindah ke jaringan interstisial.","Kerusakan filtrasi ginjal → inflamasi sistemik → peningkatan permeabilitas kapiler → edema.","Penurunan fungsi ginjal → obstruksi limfe → elephantiasis.","Hipoalbuminemia → penurunan tekanan hidrostatik kapiler → cairan masuk ke pembuluh darah → edema."],a:1,e:"Albumin hilang lewat urin → <b>hipoalbuminemia</b> → tekanan onkotik plasma turun → cairan keluar ke interstisial → edema. Opsi E salah: cairan masuk pembuluh darah tidak menyebabkan edema, dan yang turun adalah tekanan onkotik, bukan hidrostatik."},
{q:"Pada pemeriksaan Ziehl–Neelsen, bakteri tahan asam (BTA) seperti Mycobacterium tuberculosis akan tampak ...",o:["Biru dengan latar belakang merah","Merah dengan latar belakang biru","Hijau dengan latar belakang kuning","Hitam dengan latar belakang putih","Cokelat dengan latar belakang hijau"],a:1,e:"BTA mempertahankan zat warna karbol fuchsin meski didekolorisasi asam-alkohol, sehingga tampak <b>merah</b> dengan latar belakang <b>biru</b> (counterstain metilen biru)."},
{q:"Mekanisme utama terjadinya edema pada elephantiasis adalah ...",o:["Penurunan protein plasma → penurunan tekanan osmotik → cairan berpindah ke intravaskular.","Penurunan protein plasma → penurunan tekanan osmotik → cairan berpindah ke interstisial.","Obstruksi pembuluh limfe → berkurangnya pengangkutan cairan interstisial → penumpukan cairan di jaringan.","Peningkatan retensi natrium → peningkatan tekanan hidrostatik → edema.","Peningkatan permeabilitas vaskular → perpindahan cairan ke interstisial."],a:2,e:"Elephantiasis adalah edema akibat <b>obstruksi aliran limfe</b>: cairan dan protein interstisial tidak terdrainase sehingga menumpuk. B = hipoalbuminemia, D = gagal ginjal, E = inflamasi."},
{q:"Kondisi berikut dapat menyebabkan edema akibat penurunan tekanan osmotik koloid plasma, kecuali ...",o:["Penyakit hati kronis","Sindrom nefrotik","Elephantiasis","Malnutrisi berat","Hipoalbuminemia"],a:2,e:"Penyebab turunnya tekanan onkotik: penyakit hati (sintesis albumin turun), sindrom nefrotik (albumin hilang), kwashiorkor/malnutrisi, hipoalbuminemia. <b>Elephantiasis</b> disebabkan obstruksi limfe, bukan penurunan tekanan onkotik."},
{q:"Manakah pernyataan yang TIDAK benar mengenai perpindahan air melalui membran semipermeabel?",o:["Air cenderung bergerak menuju kompartemen dengan tekanan osmotik efektif lebih tinggi.","Air dapat bergerak mengikuti gradien tekanan hidrostatik.","Air bergerak dari dalam sel ke luar ketika sel berada dalam larutan hipertonik.","Air bergerak dari luar ke dalam sel ketika sel berada dalam larutan hipertonik.","Pada larutan isotonik, tidak terjadi perpindahan air netto."],a:3,e:"Larutan <b>hipertonik</b> memiliki konsentrasi zat terlarut lebih tinggi, sehingga air keluar dari sel dan sel mengerut (crenation). Pernyataan D membalik arahnya, jadi D yang salah."}
,{q:"Kelompok virus yang sering menyebabkan infeksi saluran pernapasan akut meliputi ...",o:["Influenza, parainfluenza, rhinovirus, adenovirus, RSV, dan coronavirus","HIV, HPV, virus hepatitis B, dan virus hepatitis C","Virus rabies, virus dengue, dan virus chikungunya","Rotavirus, norovirus, dan virus hepatitis A","Virus Epstein–Barr dan cytomegalovirus saja"],a:0,e:"Sekitar 80% ISPA disebabkan virus: <b>influenza, parainfluenza, rhinovirus, adenovirus, RSV, coronavirus</b> (masa inkubasi singkat, transmisi droplet atau kontak). B = virus kronik/darah, C = arbovirus/rabies, D = virus enterik, E = herpesvirus."},
{q:"Laki-laki 45 tahun palpitasi dan pusing. EKG menunjukkan takikardia supraventrikular. Mekanisme yang paling mungkin adalah ...",o:["Hipokalemia","Re-entry pada nodus atrioventrikular (AV nodal re-entry)","Infark miokard sebagai satu-satunya kemungkinan","Hipoglikemia","Peningkatan tekanan osmotik plasma"],a:1,e:"SVT paling sering akibat <b>re-entry</b> di nodus AV. Syaratnya: dua jalur konduksi paralel, blok unidireksional pada satu jalur, dan konduksi lambat hingga jaringan pulih dari refrakter. Opsi lain bukan mekanisme khas SVT."},
{q:"Baroreseptor yang berperan mendeteksi perubahan tekanan darah terdapat pada ...",o:["Medula oblongata","Arteri radialis","Arteri brakialis","Pons","Sinus karotis dan arkus aorta"],a:4,e:"Baroreseptor arterial berada di <b>sinus karotis</b> dan <b>arkus aorta</b>. Sinyalnya dikirim ke pusat kardiovaskular di medula, yang merupakan pusat kontrol, bukan reseptor."},
{q:"Hipoperfusi jaringan akibat kegagalan jantung memompa darah secara adekuat merupakan ciri ...",o:["Syok kardiogenik","Syok hipovolemik","Syok anafilaktik","Syok septik","Syok neurogenik"],a:0,e:"<b>Syok kardiogenik</b> disebabkan kegagalan pompa jantung. Hipovolemik = kehilangan volume; anafilaktik, septik, neurogenik = vasodilatasi perifer berlebihan."},
{q:"Syok merupakan kondisi ketika ...",o:["Tekanan darah meningkat melebihi normal.","Curah jantung selalu meningkat.","Perfusi jaringan tidak mampu memenuhi kebutuhan metabolisme jaringan.","Frekuensi napas menurun tanpa perubahan perfusi.","Volume darah selalu meningkat."],a:2,e:"Syok = keadaan <b>hipoperfusi jaringan</b>: aliran darah tidak mencukupi kebutuhan metabolisme. Opsi lain memakai kata \"selalu\" atau tidak berkaitan dengan perfusi."},
{q:"Salah satu fungsi atau efek vegetasi pada endokarditis infektif adalah ...",o:["Melindungi mikroorganisme dari sebagian mekanisme pertahanan imun dan antimikroba.","Meningkatkan produksi eritrosit.","Menghambat seluruh respons inflamasi tubuh.","Meningkatkan filtrasi glomerulus.","Menghentikan agregasi trombosit secara langsung."],a:0,e:"Vegetasi (fibrin + trombosit + bakteri) membentuk lapisan yang <b>melindungi bakteri</b> dari sel imun dan antibiotik. Vegetasi juga dapat lepas menjadi emboli. B, D, E tidak berhubungan; C terlalu absolut."},
{q:"Pada syok stadium dekompensasi, manakah yang BUKAN manifestasi lazim?",o:["Hipotensi","Oliguria","Koma","Takipnea","Asidosis metabolik"],a:2,e:"Dekompensasi: <b>hipotensi, takipneu/dispneu, oliguri (&lt;500 cc/hari), asidosis</b>. <b>Koma</b> baru muncul pada stadium ireversibel."},
{q:"Faktor utama yang memengaruhi tekanan darah, kecuali ...",o:["Volume darah","Frekuensi napas","Curah jantung","Stroke volume","Resistensi perifer total"],a:1,e:"Tekanan darah = curah jantung × resistensi perifer total. Curah jantung dipengaruhi denyut jantung dan stroke volume, dan volume darah memengaruhi preload. <b>Frekuensi napas</b> bukan penentu utama."},
{q:"Curah jantung ditentukan secara langsung oleh kombinasi ...",o:["Frekuensi pernapasan dan resistensi perifer","Tekanan darah dan frekuensi pernapasan","Resistensi perifer dan tekanan vena","Denyut jantung dan volume sekuncup","Tekanan osmotik plasma dan volume urine"],a:3,e:"<b>Curah jantung = denyut jantung × volume sekuncup (stroke volume)</b>. Opsi lain bukan komponen langsung."},
{q:"Protein permukaan virus influenza yang berperan utama dalam perlekatan pada reseptor sel inang adalah ...",o:["Neuraminidase","Hemagglutinin","Matriks protein","Nukleoprotein","RNA polimerase"],a:1,e:"<b>Hemagglutinin (HA)</b> melekat pada reseptor sel inang dan membantu invasi. Neuraminidase memotong ikatan sehingga virus baru dapat lepas. Opsi C–E adalah protein internal."},
{q:"Biomarker lipid yang paling bermakna menilai risiko aterosklerosis adalah ...",o:["Peningkatan LDL","Peningkatan HDL","Peningkatan kolesterol tanpa fraksi spesifik","Peningkatan trigliserida saja","Penurunan LDL"],a:0,e:"<b>LDL tinggi</b> adalah pendorong utama aterosklerosis (LDL teroksidasi → foam cell → plak). HDL bersifat protektif dan penurunan LDL justru menurunkan risiko."},
{q:"Infark miokard menyebabkan kerusakan miosit. Biomarker paling spesifik untuk kerusakan miokard adalah ...",o:["Troponin jantung (cTnI atau cTnT)","PCR sebagai penanda inflamasi umum","Glukosa darah","HDL","Hemoglobin"],a:0,e:"<b>Troponin jantung (cTnI/cTnT)</b> paling spesifik untuk nekrosis miokard. Penanda inflamasi umum, glukosa, HDL, dan Hb tidak spesifik."},
{q:"Pemeriksaan yang membantu pemilihan terapi target dan imunoterapi pada kanker tertentu meliputi ...",o:["Pemeriksaan kadar kalium saja","Pemeriksaan kadar progesteron pada semua kanker","Pemeriksaan mutasi molekuler yang relevan dan ekspresi PD-L1 sesuai indikasi","Pemeriksaan kultur darah saja","Pemeriksaan kadar D-dimer saja"],a:2,e:"Mutasi molekuler (misal EGFR) menentukan <b>terapi target</b>; ekspresi <b>PD-L1</b> menentukan kelayakan <b>imunoterapi</b>. Pemeriksaan lain tidak menentukan pilihan tersebut."},
{q:"Laki-laki 58 tahun dengan diabetes, PGK G3a, albuminuria, TD 148/88 mmHg masih hipertensi setelah amlodipin. Kalium normal, tidak ada riwayat angioedema. Terapi tambahan yang sesuai adalah ...",o:["Diltiazem tanpa mempertimbangkan risiko gangguan konduksi jantung","ACE inhibitor dengan pemantauan kreatinin dan kalium setelah 2–4 minggu","Klonidin tanpa pemantauan tekanan darah","Doksazosin tanpa memperhatikan hipotensi ortostatik","Hidralazin tanpa mempertimbangkan efek sampingnya"],a:1,e:"Pada PGK dengan diabetes dan albuminuria, <b>ACEi/ARB</b> adalah pilihan karena renoprotektif (menurunkan tekanan intraglomerulus). Pantau kreatinin, eGFR, dan kalium 2–4 minggu setelah mulai. Opsi lain mengabaikan keamanan obat."},
{q:"Kondisi yang dapat menyebabkan retensi natrium dan air sehingga memicu edema antara lain ...",o:["Gagal ginjal","Elephantiasis sebagai penyebab utama retensi natrium","Penurunan kadar natrium tanpa gangguan regulasi cairan","Penurunan tekanan hidrostatik kapiler","Peningkatan drainase limfatik"],a:0,e:"<b>Gagal ginjal</b> menyebabkan retensi natrium dan air sehingga volume dan tekanan hidrostatik naik. Elephantiasis adalah obstruksi limfe, sedangkan C, D, E justru tidak menimbulkan edema."},
{q:"Virus yang secara klasik dikenal sebagai salah satu penyebab perikarditis adalah ...",o:["Mycobacterium tuberculosis","Coxsackievirus B","Candida albicans","Aspergillus fumigatus","Bordetella pertussis"],a:1,e:"<b>Coxsackievirus B</b> (enterovirus) penyebab klasik perikarditis viral. A bakteri, C dan D jamur, E bakteri saluran napas."},
{q:"Pada hipertensi jangka panjang, baroreseptor dapat mengalami resetting. Artinya ...",o:["Baroreseptor selalu meningkatkan respons terhadap tekanan darah normal","Baroreseptor mengalami kerusakan permanen","Baroreseptor berubah menjadi kemoreseptor","Baroreseptor beradaptasi dengan tekanan darah yang lebih tinggi sehingga titik pengaturannya bergeser","Baroreseptor berhenti menerima rangsangan dari perubahan tekanan darah"],a:3,e:"<b>Resetting</b> = adaptasi: set point bergeser ke tekanan lebih tinggi, sehingga tekanan tinggi dianggap \"normal\". Reseptor tidak rusak dan tetap berfungsi."},
{q:"Pasien sesak napas dan mengi disertai eosinofil darah meningkat. Dokter ingin menilai eosinofil langsung pada saluran pernapasan. Sampel yang dapat diperiksa adalah ...",o:["Urine","Cairan serebrospinal","Serum","Sputum pernapasan","Feses"],a:3,e:"Eosinofil di saluran napas dinilai langsung dari <b>sputum</b>. Urine, CSS, serum, dan feses tidak mencerminkan kondisi saluran napas."},
{q:"Hipoperfusi jaringan akibat infeksi sistemik dapat menyebabkan jenis syok berupa ...",o:["Syok kardiogenik","Syok hipovolemik","Syok anafilaktik","Syok septik","Syok neurogenik"],a:3,e:"Septikemia/infeksi bakteri sistemik → vasodilatasi perifer → <b>syok septik</b>."},
{q:"Saat kelebihan cairan, hormon yang meningkatkan ekskresi natrium dan air adalah ...",o:["ADH","Atrial natriuretic peptide (ANP)","Aldosteron","Renin","Angiotensin II"],a:1,e:"Regangan atrium → pelepasan <b>ANP</b> → natriuresis dan diuresis, menekan renin, ADH, dan aldosteron. Opsi lain justru menahan natrium dan air."},
{q:"Paparan asap rokok kronis dapat menyebabkan inflamasi sistemik. Biomarker yang menunjukkan respons inflamasi tersebut adalah ...",o:["Kreatinin","Sitokin","Bilirubin","Albumin serum","Urea nitrogen darah"],a:1,e:"<b>Sitokin</b> (IL-6, TNF-α, dll.) mencerminkan inflamasi. Kreatinin dan BUN = fungsi ginjal, bilirubin = hati, albumin = status protein."},
{q:"Pasien HIV lanjut dengan efusi perikardium dan dugaan infeksi oportunistik. Di daerah endemis TB, penyebab penting yang harus dipertimbangkan adalah ...",o:["Staphylococcus epidermidis","Mycobacterium tuberculosis","Bordetella pertussis","Corynebacterium diphtheriae","Clostridium tetani"],a:1,e:"Perikarditis pada HIV di daerah endemis terutama dipikirkan <b>Mycobacterium tuberculosis</b> (perikarditis TB). Opsi lain bukan penyebab khas."},
{q:"Jamur yang khas memiliki hifa bersepta dengan percabangan sudut akut sekitar 45° adalah ...",o:["Candida spp.","Histoplasma capsulatum","Blastomyces dermatitidis","Aspergillus spp.","Coccidioides immitis"],a:3,e:"<b>Aspergillus</b>: hifa bersepta, bercabang akut ±45°. Candida = ragi/pseudohifa; Histoplasma, Blastomyces, Coccidioides = jamur dimorfik."},
{q:"Karakteristik refleks baroreseptor jangka pendek, kecuali ...",o:["Memengaruhi curah jantung","Diperantarai sistem saraf otonom","Memengaruhi frekuensi denyut jantung","Memengaruhi resistensi vaskular perifer","Respons utamanya berlangsung selama menit-hari"],a:4,e:"Refleks jangka pendek berlangsung <b>beberapa detik</b> melalui otonom (curah jantung dan resistensi perifer). Penyesuaian menit–hari (volume darah) adalah <b>jangka panjang</b>."},
{q:"Faktor yang dapat berperan dalam hipertensi primer, kecuali ...",o:["Gangguan penanganan garam","Perubahan zat kimia vasoaktif","Gangguan regulasi tekanan darah","Sindrom Conn","Gangguan mekanisme transpor ion"],a:3,e:"<b>Sindrom Conn</b> (hiperaldosteronisme primer) adalah penyebab hipertensi <b>sekunder/endokrin</b>. Hipertensi primer berkaitan dengan garam, pompa Na-K, vasoaktif, dan regulasi tekanan."},
{q:"Perempuan palpitasi setelah mengonsumsi kopi berlebihan. Zat yang paling mungkin menyebabkan adalah ...",o:["Nikotin","Kafein","Histamin","Insulin","Albumin"],a:1,e:"<b>Kafein</b> meningkatkan aktivitas simpatis dan pelepasan Ca²⁺ di sel jantung, sehingga kontraksi dan denyut meningkat (palpitasi)."},
{q:"Vegetasi pada endokarditis infektif umumnya terdiri atas ...",o:["Eritrosit dan leukosit saja","Fibrin, trombosit, mikroorganisme, dan sel inflamasi","Kolagen dan osteosit","Sel adiposa dan fibroblas","Sel epitel dan keratin"],a:1,e:"Vegetasi = massa <b>fibrin, trombosit, mikroorganisme, dan sel inflamasi</b> pada katup. Opsi lain bukan penyusunnya."},
{q:"Media padat yang digunakan untuk kultur Mycobacterium tuberculosis adalah ...",o:["Agar darah","Sabouraud dextrose agar","Ziehll-Nielsen","Potato dextrose agar","MacConkey agar"],a:2,e:"<b>Catatan:</b> kunci PDF memilih C, tetapi Ziehl–Neelsen sebenarnya <b>pewarnaan BTA</b>, bukan media. Media padat kultur TB yang benar adalah <b>Löwenstein–Jensen</b>. Karena opsi itu tidak ada, C dipilih sebagai paling dekat dengan TB. Agar darah, Sabouraud, PDA, dan MacConkey bukan media TB. Sebaiknya konfirmasi ke penyusun soal."},
{q:"Pemeriksaan untuk mendeteksi M. tuberculosis sekaligus resistansi rifampisin secara molekuler adalah ...",o:["Kultur darah rutin","Pewarnaan Gram","Tes Cepat Molekuler (TCM)","Pemeriksaan KOH","Uji katalase"],a:2,e:"<b>TCM (Xpert MTB/RIF)</b> mendeteksi DNA M. tuberculosis dan mutasi gen rpoB penanda resistansi rifampisin. Gram, KOH, dan katalase tidak mendeteksi resistansi."},
{q:"Bakteri penyebab pertusis atau batuk rejan adalah ...",o:["Haemophilus influenzae","Staphylococcus aureus","Bordetella pertussis","Corynebacterium diphtheriae","Mycobacterium tuberculosis"],a:2,e:"<b>Bordetella pertussis</b> melekat pada epitel bronkus bersilia dan menghasilkan toksin pertusis (faktor virulensi utama). C. diphtheriae = difteri; M. tuberculosis = TB."}
,{q:"Manifestasi yang dapat terjadi pada syok ireversibel, kecuali ...",o:["Hipotensi berat","Takikardia berat","Gangguan kesadaran hingga koma","Anuria dan asidosis berat","Poliuria"],a:4,e:"Syok ireversibel: hipotensi dan takikardia hebat, respiratory distress, penurunan kesadaran hingga koma, <b>anuria</b>, asidosis hebat, berujung kematian. <b>Poliuria</b> tidak sesuai karena ginjal gagal (anuria)."},
{q:"Edema akibat peningkatan tekanan hidrostatik kapiler dapat terjadi pada ...",o:["Gagal jantung kanan","Sindrom nefrotik akibat hipoalbuminemia","Penyakit hati akibat penurunan albumin","Kwashiorkor","Obstruksi limfatik"],a:0,e:"<b>Gagal jantung kanan</b> meningkatkan tekanan vena dan hidrostatik kapiler sehingga cairan keluar. B, C, D = tekanan onkotik turun; E = hambatan drainase limfe."},
{q:"Foam cell dalam pembentukan plak aterosklerosis terutama berasal dari ...",o:["Monosit yang berisi LDL tanpa modifikasi","Monosit yang berisi LDL teroksidasi","Makrofag yang berisi LDL tanpa modifikasi","Makrofag yang menelan LDL teroksidasi","Sel busa yang berisi small LDL saja"],a:3,e:"Monosit masuk ke intima dan berdiferensiasi menjadi <b>makrofag</b>, yang memfagosit <b>LDL teroksidasi</b> lalu menjadi <b>foam cell</b>. Monosit belum menelan lipid, dan LDL tanpa modifikasi tidak ditelan reseptor scavenger."},
{q:"Demam reumatik dapat terjadi setelah infeksi Streptococcus pyogenes. Mekanisme utama kerusakan jaringan jantung adalah ...",o:["Pembentukan vegetasi infektif pada katup jantung","Gangguan metabolisme kolagen akibat toksin bakteri secara langsung","Nekrosis jaringan akibat invasi bakteri ke seluruh miosit","Reaksi autoimun silang antara antigen streptokokus dan jaringan tubuh (molecular mimicry)","Reaksi toksik langsung terhadap jantung oleh bakteri"],a:3,e:"Demam reumatik adalah komplikasi <b>autoimun</b>: antibodi terhadap protein M streptokokus bereaksi silang dengan jaringan jantung (<b>molecular mimicry</b>). Vegetasi infektif ada pada endokarditis infektif, bukan demam reumatik."},
{q:"Respiratory distress syndrome pada bayi prematur terutama disebabkan oleh ...",o:["Penutupan dini ductus arteriosus","Kekurangan surfaktan yang diproduksi pneumosit tipe II","Infeksi intrauterin sebagai penyebab tunggal","Kelebihan surfaktan pada alveoli","Peningkatan produksi mukus pada bronkus"],a:1,e:"Pneumosit tipe II belum matang pada bayi prematur sehingga <b>surfaktan kurang</b>, tegangan permukaan alveolus tinggi, alveolus kolaps (atelektasis)."},
{q:"Pasien anemia berat dan palpitasi saat aktivitas ringan. Mekanisme kompensasi yang paling mungkin adalah ...",o:["Penurunan preload ventrikel","Peningkatan denyut jantung untuk mempertahankan pengiriman oksigen ke jaringan","Penurunan curah jantung sebagai respons utama","Penurunan kebutuhan oksigen jaringan","Hipoglikemia akibat disfungsi katup"],a:1,e:"Anemia → Hb turun → kandungan O₂ darah turun → aktivasi simpatis → <b>takikardia dan curah jantung naik</b> untuk mempertahankan pengiriman O₂."},
{q:"Laki-laki 70 tahun menggunakan verapamil lalu diberi metoprolol. Denyut jantung turun menjadi 42 kali/menit. Mekanisme yang paling mungkin adalah ...",o:["Peningkatan aktivitas simpatis","Efek gabungan yang menekan denyut jantung dan konduksi atrioventrikular","Peningkatan kontraktilitas jantung","Peningkatan pelepasan renin","Peningkatan konduksi nodus AV"],a:1,e:"Verapamil memblokir kanal Ca²⁺ tipe L pada nodus SA dan AV, sedangkan metoprolol memblokir reseptor β₁. Keduanya menekan nodus SA/AV sehingga efek gabungannya berlebihan: <b>bradikardia dan blok AV</b>."},
{q:"ARNI direkomendasikan pada pasien tertentu dengan HFrEF. Mekanisme kerjanya adalah ...",o:["Inhibisi Na⁺/K⁺-ATPase dan blokade aldosteron","Menurunkan denyut jantung dan meningkatkan kalsium intraseluler","Inhibisi neprilysin dan blokade reseptor angiotensin II","Blokade reseptor angiotensin I dan vasodilatasi vena","Inhibisi SGLT2"],a:2,e:"ARNI (sacubitril/valsartan): sacubitril <b>menghambat neprilysin</b> (peptida natriuretik naik), valsartan <b>memblokir reseptor AT1 angiotensin II</b>. Opsi A = digoksin/spironolakton, E = SGLT2 inhibitor."},
{q:"Perempuan 32 tahun, TD klinik 159/90 mmHg, tetapi pemantauan rumah tujuh hari berbeda cukup jauh. Tindakan paling tepat adalah ...",o:["Langsung memberikan amlodipin tanpa evaluasi lanjutan","Langsung memberikan captopril tanpa konfirmasi","Langsung memberikan kombinasi dua antihipertensi","Mengulangi evaluasi dan mengonfirmasi diagnosis menggunakan pengukuran tekanan darah yang terstandar","Memberikan furosemid untuk semua pasien dengan tekanan darah tinggi"],a:3,e:"Selisih klinik–rumah menimbulkan dugaan <b>white-coat effect</b>. <b>Konfirmasi dengan HBPM/ABPM</b> sebelum memulai terapi. Obat langsung berisiko hipotensi dan terapi tidak perlu."},
{q:"Pasien sesak napas dengan pCO₂ 60 mmHg, pH 7,26, pO₂ 55 mmHg, HCO₃⁻ ±27 mEq/L. Gangguan asam-basa primer adalah ...",o:["Asidosis metabolik","Alkalosis respiratorik","Gangguan asam-basa tidak dapat dinilai","Asidosis respiratorik","Alkalosis metabolik"],a:3,e:"pH &lt;7,35 = asidosis. pCO₂ naik (60) menjelaskan penurunan pH, sehingga <b>asidosis respiratorik</b>. HCO₃⁻ sedikit naik = awal kompensasi ginjal, belum cukup menormalkan pH."},
{q:"Infeksi Corynebacterium diphtheriae. Ciri khas patogenesisnya adalah ...",o:["Membentuk pseudomembran pada faring","Menyebabkan pembentukan syncytium akibat fusi sel epitel","Menginvasi eritrosit dan berkembang biak di dalamnya","Membentuk endospora untuk bertahan hidup","Menginfeksi sel T CD4 dan menyebabkan penurunan imunitas"],a:0,e:"Toksin difteri menghambat sintesis protein sehingga terbentuk <b>pseudomembran</b> faring (plak keabuan). Toksin juga dapat menyebabkan miokarditis. B = RSV, E = HIV."},
{q:"Virus yang secara klasik dikenal sebagai penyebab penting miokarditis adalah ...",o:["Legionella pneumophila","Coxsackievirus B","Streptococcus pneumoniae","Candida albicans","Bordetella pertussis"],a:1,e:"<b>Coxsackievirus B</b> (enterovirus) adalah penyebab virus tersering miokarditis. Opsi lain bukan virus."},
{q:"Infark miokard menyebabkan nekrosis dan inflamasi. Pemeriksaan yang terutama menilai respons inflamasi sistemik adalah ...",o:["Cardiac troponin I","Cardiac troponin T","CK-MB","C-reactive protein (CRP)","BNP"],a:3,e:"<b>CRP</b> adalah protein fase akut penanda inflamasi sistemik. Troponin dan CK-MB menilai kerusakan miosit, BNP menilai gagal jantung."},
{q:"Dalam pembagian klasik berdasarkan waktu setelah operasi, mikroorganisme yang sering dikaitkan dengan endokarditis katup prostetik yang muncul lebih dari dua bulan setelah operasi adalah ...",o:["Staphylococcus aureus","Streptokokus viridans","Streptococcus pneumoniae","Pseudomonas aeruginosa","Haemophilus influenzae"],a:1,e:"Pada endokarditis katup prostetik <b>lambat</b> (&gt;2 bulan) pola mikrobanya mendekati endokarditis katup asli, dengan <b>streptokokus viridans</b> sebagai penyebab tersering (flora mulut). Penyebab dini (&lt;2 bulan) lebih sering stafilokokus dan Gram-negatif."},
{q:"Hipoperfusi akibat peningkatan permeabilitas pembuluh darah yang menyebabkan kebocoran cairan ke jaringan dapat terjadi pada ...",o:["Syok kardiogenik","Syok hipovolemik akibat perdarahan","Syok anafilaktik","Syok akibat gagal pompa jantung","Syok akibat stenosis katup"],a:2,e:"Pada <b>syok anafilaktik</b>, mediator alergi (histamin) menyebabkan vasodilatasi dan permeabilitas naik sehingga cairan bocor ke jaringan. Opsi lain tidak melibatkan kebocoran kapiler."},
{q:"Definisi syok yang paling tepat adalah ...",o:["Keadaan hipoperfusi jaringan ketika aliran darah tidak mencukupi kebutuhan metabolik jaringan","Keadaan ketika suplai oksigen ke otak berkurang tanpa memengaruhi organ lain","Keadaan ketika tubuh tidak mampu mempertahankan tekanan darah normal, tetapi perfusi tetap adekuat","Penurunan tekanan darah akibat kehilangan darah akut tanpa dampak pada metabolisme sel","Kelebihan cairan intravaskular yang menurunkan difusi oksigen ke jaringan"],a:0,e:"Syok = <b>hipoperfusi jaringan</b>: aliran darah tidak memenuhi kebutuhan metabolik, melibatkan banyak organ. Opsi lain membatasi pada otak, atau menyebut perfusi tetap adekuat."},
{q:"Pasangan organ dan perubahan pada syok berat yang TIDAK sesuai adalah ...",o:["Paru — gangguan pernapasan akut","Saluran gastrointestinal — iskemia mukosa dan perdarahan","Ginjal — nekrosis tubular akut","Hati — nekrosis sentrilobular","Otak — hipertrofi sebagai respons khas terhadap hipoperfusi akut"],a:4,e:"Hipoperfusi pada otak menyebabkan <b>iskemia</b> (klinis seperti stroke), bukan hipertrofi. Paru: ARDS; GI: erosi/perdarahan; ginjal: nekrosis tubular; hati: nekrosis sentrilobular."},
{q:"Struktur berikut yang berasal dari endoderm adalah ...",o:["Epitel alveolus","Otot polos esofagus","Tulang rawan trakea","Pleura visceralis","Pleura parietalis"],a:0,e:"Endoderm foregut membentuk <b>epitel</b> saluran napas (laring, trakea, bronkus, alveolus). Otot, tulang rawan, dan pleura berasal dari mesoderm."},
{q:"Amlodipin dapat diberikan satu kali sehari. Karakteristik farmakokinetik yang mendukung adalah ...",o:["Bioavailabilitas sangat rendah dan ekskresi ginjal sangat cepat","Efek hanya muncul setelah metabolit terakumulasi selama beberapa minggu","Waktu paruh eliminasi panjang sehingga efeknya dapat bertahan sekitar 24 jam","Absorpsi berlangsung sangat cepat dan efeknya hanya beberapa menit","Obat tidak mengalami metabolisme"],a:2,e:"Amlodipin punya <b>waktu paruh panjang</b>, sehingga cukup diberikan sekali sehari. Nifedipin kerja cepat justru dihindari untuk kontrol rutin."},
{q:"Ibu hamil dengan hipertensi sebelumnya mengonsumsi captopril. Pilihan pengganti yang sesuai adalah ...",o:["Labetalol atau nifedipin lepas lambat","ACE inhibitor atau ARB","Spironolakton sebagai pilihan rutin","Aliskiren","Kombinasi ACE inhibitor dan ARB"],a:0,e:"Pada kehamilan, penghambat RAAS (ACEi, ARB, aliskiren) <b>dihindari</b> karena teratogenik. Pilihan: <b>labetalol, nifedipin lepas lambat, atau metildopa</b>."},
{q:"Pasien 65 tahun dengan hipertensi, HFrEF (EF 32%), dan fibrilasi atrium tanpa blok AV. Pilihan pengendalian denyut jantung yang sesuai adalah ...",o:["Verapamil","Diltiazem","Nifedipin kerja cepat","Klonidin tanpa pemantauan","Beta-blocker yang terbukti bermanfaat pada HFrEF, dengan titrasi dan pemantauan yang tepat"],a:4,e:"Pada HFrEF, verapamil dan diltiazem <b>dihindari</b> (menekan kontraktilitas). Pilih <b>beta-blocker</b> yang terbukti memperbaiki luaran, dengan titrasi bertahap."},
{q:"Feokromositoma dapat menyebabkan hipertensi melalui mekanisme ...",o:["Peningkatan aldosteron dari korteks adrenal sebagai mekanisme utama","Peningkatan sekresi katekolamin, terutama epinefrin dan norepinefrin, oleh tumor medula adrenal","Penurunan aktivitas saraf simpatis","Penurunan resistensi vaskular sistemik secara menetap","Penurunan denyut jantung akibat stimulasi parasimpatis"],a:1,e:"Feokromositoma = tumor medula adrenal yang melepas <b>katekolamin</b>, sehingga vasokonstriksi dan curah jantung naik. Peningkatan aldosteron adalah sindrom Conn."},
{q:"Wanita 60 tahun, TD klinik 156/96 mmHg, rata-rata rumah tujuh hari 126/76 mmHg. Sebelum meningkatkan dosis, langkah paling tepat adalah ...",o:["Langsung menaikkan dosis beta blocker","Mengevaluasi kemungkinan white-coat hypertension dan mengonfirmasi tekanan darah menggunakan pengukuran rumah atau ABPM","Menambahkan diuretik tanpa pemeriksaan lanjutan","Menghentikan seluruh obat antihipertensi secara langsung","Mengabaikan semua hasil pengukuran klinik"],a:1,e:"TD klinik tinggi namun TD rumah normal → curiga <b>white-coat effect</b>. Konfirmasi dengan <b>HBPM/ABPM</b> sebelum intensifikasi terapi untuk mencegah hipotensi."},
{q:"Wanita dengan TD 132/84 mmHg duduk dan 108/74 mmHg berbaring setelah obat antihipertensi. Langkah selanjutnya yang paling sesuai adalah ...",o:["Langsung meningkatkan dosis antihipertensi","Menghentikan semua obat tanpa evaluasi","Mengevaluasi gejala dan kemungkinan hipotensi ortostatik serta meninjau kembali terapi dan pengukuran tekanan darah","Menambahkan obat penurun tekanan darah lain","Mengabaikan perubahan tekanan darah tersebut"],a:2,e:"Perbedaan TD antarposisi perlu dinilai sebagai kemungkinan <b>hipotensi ortostatik</b>: evaluasi gejala (pusing), tinjau terapi, dan ukur TD posisi duduk/berbaring/berdiri. Menaikkan atau menambah obat berisiko memperburuk."},
{q:"Pemberian verapamil bersama metoprolol dapat meningkatkan risiko ...",o:["Takikardia dan peningkatan konduksi atrioventrikular","Bradikardia dan depresi konduksi atrioventrikular","Hipertensi berat akibat aktivasi simpatis","Peningkatan kontraktilitas ventrikel","Peningkatan otomatisitas nodus sinoatrial"],a:1,e:"Interaksi β-blocker + verapamil: risiko <b>bradikardia, blok AV, dan depresi kontraktilitas</b> karena keduanya menekan nodus SA dan AV."},
{q:"Pria 50 tahun dengan anemia dan jantung berdebar saat aktivitas ringan. Mekanisme yang paling sesuai adalah ...",o:["Penurunan preload sebagai satu-satunya mekanisme","Penurunan kapasitas pengangkutan oksigen yang memicu kompensasi peningkatan denyut jantung","Hipoglikemia sebagai mekanisme utama","Vasokonstriksi sistemik sebagai satu-satunya penyebab","Penurunan kebutuhan oksigen jaringan"],a:1,e:"Anemia menurunkan <b>kapasitas angkut O₂</b>, sehingga tubuh menaikkan denyut jantung (kompensasi) untuk mempertahankan penghantaran O₂. Kebutuhan oksigen jaringan tidak turun."},
{q:"Jenis syok yang dapat terjadi akibat nyeri hebat adalah ...",o:["Syok kardiogenik","Syok neurogenik","Syok septik","Syok anafilaktik","Syok hipovolemik"],a:1,e:"Nyeri hebat menghambat aktivitas vasokonstriktor simpatis → vasodilatasi berlebihan → <b>syok neurogenik</b>."},

const $=s=>document.querySelector(s),L='ABCDE';let mode,i=0,ans={},fl={},rv=0,T=0,tm,fin=0;
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('kc32_'+k));localStorage.setItem('kc32_'+k,JSON.stringify(v))}catch(e){return null}}
function toast(m){const t=$('#t');t.textContent=m;t.className='on';setTimeout(()=>t.className='',1000)}
function cor(){return Q.filter((q,k)=>ans[k]===q.a).length}
function home(){clearInterval(tm);mode=null;const b=ls('best');$('#sc').textContent=Q.length+' soal';$('#app').innerHTML='<h3>Pilih mode belajar</h3><div class="modes">'+[['study','Study','Jawaban dan pembahasan muncul langsung'],['exam','Exam','Timer 90 menit, jawaban disembunyikan sampai selesai'],['drill','Drill','Ulangi sampai benar, otomatis lanjut']].map(m=>`<button class="mode" onclick="start('${m[0]}')"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')+`</div><p class="mut">Kunci: A–E jawab · ←/→ pindah · F tandai${b!=null?' · Skor terbaik Exam: '+b+'%':''}</p>`}
function start(m){mode=m;i=0;ans={};fl={};rv=0;fin=0;clearInterval(tm);if(m=='exam'){T=5400;tm=setInterval(()=>{T--;if(T<=0)finish();else{const e=$('#tm');if(e)e.textContent=fmt(T)}},1000)}render()}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function pick(k){const q=Q[i];if(fin&&!rv||rv||!mode)return;if(mode=='study'&&ans[i]!=null)return;if(mode=='drill'){if(ans[i]===q.a)return;ans[i]=k;if(k===q.a){toast('Benar! 🔥');setTimeout(()=>{if(i<Q.length-1){i++}render()},1200)}else toast('Belum tepat, coba lagi')}else ans[i]=k;render()}
function go(n){if(n<0||n>=Q.length)return;i=n;render()}
function flag(){fl[i]=!fl[i];render()}
function render(){const q=Q[i],s=ans[i],show=rv||mode=='study'&&s!=null||mode=='drill'&&s===q.a;
$('#sc').textContent=mode=='exam'&&!rv?Object.keys(ans).length+'/'+Q.length+' dijawab':cor()+' benar';
$('#app').innerHTML=`<div class="bar"><i style="width:${(i+1)/Q.length*100}%"></i></div><div class="map">${Q.map((x,k)=>`<i class="${k==i?'c':ans[k]!=null?'d':''} ${fl[k]?'fl':''}" onclick="go(${k})">${k+1}</i>`).join('')}</div><div class="card"><div class="qn"><span>Soal ${i+1} / ${Q.length}</span>${mode=='exam'&&!rv?'<span id="tm">'+fmt(T)+'</span>':''}</div><div>${q.q}</div>${q.o.map((t,k)=>{let c='opt';if(show&&k==q.a)c+=' ok';else if(s===k&&(show||mode=='drill'&&s!==q.a))c+=' bad';else if(s===k)c+=' sel';return`<button class="${c}" onclick="pick(${k})"><b>${L[k]}</b><span>${t}</span></button>`}).join('')}${show?`<div class="exp"><b>Jawaban: ${L[q.a]}.</b> ${q.e}</div>`:''}</div><div class="nav"><button class="b" onclick="go(i-1)">← Sebelumnya</button><button class="b f ${fl[i]?'on':''}" onclick="flag()">⚑ Tandai</button>${i<Q.length-1?'<button class="b p" onclick="go(i+1)">Berikutnya →</button>':mode=='exam'&&!rv?'<button class="b p" onclick="finish()">Selesai</button>':'<button class="b p" onclick="home()">Menu</button>'}</div>${mode=='exam'&&!rv?'<div class="nav"><button class="b" onclick="finish()">Selesaikan ujian</button></div>':''}`}
function finish(){clearInterval(tm);fin=1;const c=cor(),p=Math.round(c/Q.length*100),b=ls('best');if(b==null||p>b)ls('best',p);$('#sc').textContent=c+' benar';$('#app').innerHTML=`<div class="card"><p class="mut">Hasil Exam</p><p class="big">${p}%</p><p>${c} benar dari ${Q.length} soal · ${Object.keys(ans).length} dijawab</p></div><div class="nav"><button class="b p" onclick="rv=1;i=0;render()">Review jawaban</button><button class="b" onclick="home()">Menu</button></div>`}
document.addEventListener('keydown',e=>{if(!mode||fin&&!rv&&!$('.card .qn'))return;const k=e.key.toUpperCase();if('ABCDE'.includes(k)&&k.length==1)pick(L.indexOf(k));else if(e.key=='ArrowRight')go(i+1);else if(e.key=='ArrowLeft')go(i-1);else if(k=='F')flag()});
home();
</script></body></html>
